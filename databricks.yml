bundle:
  name: mlops-starter

variables:
  catalog:
    description: Unity Catalog
    default: mlops
  schema:
    description: Schema
    default: customer-churn-prediction
  input_table:
    default: ecommerce_customer_churn_dataset
  train_table:
    default: ecommerce_customer_churn_train
  val_table:
    default: ecommerce_customer_churn_val
  test_table:
    default: ecommerce_customer_churn_test
  model_name:
    default: "main.${var.schema}.model"

targets:
  dev:
    default: true
    workspace:
      host: https://dbc-5cf8149b-20d2.cloud.databricks.com
    variables:
      schema: dev_schema

  staging:
    workspace:
      host: https://dbc-5cf8149b-20d2.cloud.databricks.com
    variables:
      schema: staging_schema

  prod:
    workspace:
      host: https://dbc-5cf8149b-20d2.cloud.databricks.com
    variables:
      schema: prod_schema

resources:
  jobs:
    ml_pipeline:
      name: ml-pipeline-template
      job_clusters:
        - job_cluster_key: serverless
          new_cluster:
            spark_version: 14.3.x-scala2.12
            data_security_mode: SINGLE_USER
            runtime_engine: PHOTON
      tasks:
        - task_key: process
          job_cluster_key: serverless
          spark_python_task:
            python_file: src/process.py
            parameters:
              - --catalog
              - "{{var.catalog}}"
              - --schema
              - "{{var.schema}}"
              - --input_table
              - "{{var.input_table}}"
              - --train_table
              - "{{var.train_table}}"
              - --val_table
              - "{{var.val_table}}"
              - --test_table
              - "{{var.test_table}}"
          # new_cluster:
          #   spark_version: 14.3.x-scala2.12
          #   node_type_id: i3.xlarge
          #   num_workers: 1
        - task_key: train
          job_cluster_key: serverless
          depends_on:
            - task_key: process
          spark_python_task:
            python_file: src/train.py
            parameters:
              - --catalog
              - "{{var.catalog}}"
              - --schema
              - "{{var.schema}}"
              - --train_table
              - "{{var.train_table}}"
              - --val_table
              - "{{var.val_table}}"
              - --model_name
              - "{{var.model_name}}"
          # new_cluster:
          #   spark_version: 14.3.x-scala2.12
          #   node_type_id: i3.xlarge
          #   num_workers: 1
        - task_key: evaluate
          job_cluster_key: serverless
          depends_on:
            - task_key: train
          spark_python_task:
            python_file: src/evaluate.py
            parameters:
              - --catalog
              - "{{var.catalog}}"
              - --schema
              - "{{var.schema}}"
              - --test_table
              - "{{var.test_table}}"
              - --model_name
              - "{{var.model_name}}"
          # new_cluster:
          #   spark_version: 14.3.x-scala2.12
          #   node_type_id: i3.xlarge
          #   num_workers: 1
