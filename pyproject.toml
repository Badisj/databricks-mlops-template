[project]
name = "mlops_starter"
version = "0.1.0"
description = "Template for Databricks MLOps pipelines"
authors = [
    { name = "Mohamed Badis.jaouani", email = "mohamedbadis.jaouani@icloud.com" }
]
# readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.25",
    "scikit-learn>=1.3",
    "mlflow>=2.5",
    "databricks-cli>=0.221.0",
    "pyyaml>=6.0"
]

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

# Optional tool configuration (linting / formatting)
[tool.black]
line-length = 88
target-version = ["py39"]

[tool.isort]
profile = "black"

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--strict-markers"
testpaths = ["tests"]