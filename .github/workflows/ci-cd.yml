name: Databricks MLOps CI/CD

on:
  push:
    branches:
      - dev
      - staging
      - main
  pull_request:
    branches:
      - dev
      - staging
      - main
  workflow_dispatch:
    inputs:
      input_table:
        description: "Optional override input table"
        required: false
      train_table:
        description: "Optional override train table"
        required: false
      val_table:
        description: "Optional override val table"
        required: false
      test_table:
        description: "Optional override test table"
        required: false
      model_name:
        description: "Optional override model name"
        required: false
      deploy_strategy:
        description: "Deployment strategy: first/shadow/canary/ab/bluegreen"
        required: false
        default: first
      approve_prod:
        description: "Manual approval to deploy to PROD"
        required: false
        default: "no"

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Checkout
      - uses: actions/checkout@v4

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # # Upgrade pip and build tools
      # - name: Upgrade pip, setuptools, wheel, build
      #   run: python -m pip install --upgrade pip setuptools wheel build

      # # Debug: list repo root to confirm pyproject.toml
      # - name: List repo root
      #   run: ls -l ${{ github.workspace }}

      # # Build wheel from pyproject.toml
      # - name: Build Python package
      #   working-directory: ${{ github.workspace }}
      #   run: python -m build --wheel

      # # Install package editable from wheel
      # - name: Install editable package
      #   working-directory: ${{ github.workspace }}
      #   run: pip install -e dist/*.whl

      # Install Databricks CLI
      - uses: databricks/setup-cli@v0.221.0

      # Validate bundle
      - name: Validate bundle
        run: databricks bundle validate -t ${{ github.ref_name }}

      # Verify Databricks authentication
      - name: Verify Databricks auth
        run: databricks current-user me

      # Deploy bundle to workspace based on branch
      - name: Deploy bundle
        run: |
          CMD="databricks bundle deploy -t ${{ github.ref_name }}"

          # Override variables if workflow_dispatch inputs exist
          if [[ "${{ github.event.inputs.input_table }}" != "" ]]; then
            CMD="$CMD --var input_table=${{ github.event.inputs.input_table }}"
          fi
          if [[ "${{ github.event.inputs.train_table }}" != "" ]]; then
            CMD="$CMD --var train_table=${{ github.event.inputs.train_table }}"
          fi
          if [[ "${{ github.event.inputs.val_table }}" != "" ]]; then
            CMD="$CMD --var val_table=${{ github.event.inputs.val_table }}"
          fi
          if [[ "${{ github.event.inputs.test_table }}" != "" ]]; then
            CMD="$CMD --var test_table=${{ github.event.inputs.test_table }}"
          fi
          if [[ "${{ github.event.inputs.model_name }}" != "" ]]; then
            CMD="$CMD --var model_name=${{ github.event.inputs.model_name }}"
          fi

          echo "Running: $CMD"
          $CMD

      # Install Python dependencies
      - name: Install Python dependencies
        run: pip install -e .

      # Run ML pipeline in DEV/STAGING
      - name: Run ML pipeline dynamically
        run: |
          JOB_NAME="ml-pipeline-template-dev"
          echo "Looking for job: $JOB_NAME"
          JOB_ID=$(databricks jobs list -o json | jq -r --arg name "$JOB_NAME" '.[] | select(.settings.name==$name) | .job_id')

          if [[ -z "$JOB_ID" ]]; then
              echo "Error: Job '$JOB_NAME' not found!"
              exit 1
          fi 

          
          echo "Triggering job..."

          RUN_OUTPUT=$(databricks jobs run-now $JOB_ID -o json)
          echo "$RUN_OUTPUT"

          RUN_ID=$(echo "$RUN_OUTPUT" | jq -r '.run_id')
          echo "Run ID: $RUN_ID"

          echo "Waiting for completion..."
          databricks runs wait $RUN_ID

          echo "Fetching run details..."
          databricks runs get $RUN_ID -o json

      # Manual approval gate for PROD
      - name: Manual approval for PROD deployment
        if: ${{ github.ref_name == 'main' }}
        uses: hmarr/auto-approve-action@v2
        with:
          comment: "Approve deployment to PROD"
        env:
          APPROVE: ${{ github.event.inputs.approve_prod }}
        continue-on-error: false

      # Deployment strategy orchestration (first/shadow/canary/AB/bluegreen)
      - name: Deploy model strategy
        if: ${{ github.ref_name == 'main' && github.event.inputs.approve_prod == 'yes' }}
        run: |
          STRATEGY="${{ github.event.inputs.deploy_strategy }}"

          echo "Deploying model using strategy: $STRATEGY"

          case "$STRATEGY" in
            first)
              echo "Deploying model to first users / limited traffic"
              databricks model deploy --name "${{ github.event.inputs.model_name }}" --strategy first
              ;;
            shadow)
              echo "Deploying model as shadow"
              databricks model deploy --name "${{ github.event.inputs.model_name }}" --strategy shadow
              ;;
            canary)
              echo "Deploying model as canary (partial traffic)"
              databricks model deploy --name "${{ github.event.inputs.model_name }}" --strategy canary --traffic 10
              ;;
            ab)
              echo "Deploying model as AB test (split traffic)"
              databricks model deploy --name "${{ github.event.inputs.model_name }}" --strategy ab --traffic 50
              ;;
            bluegreen)
              echo "Deploying model fully (Blue-Green)"
              databricks model deploy --name "${{ github.event.inputs.model_name }}" --strategy bluegreen
              ;;
            *)
              echo "Unknown strategy: $STRATEGY"
              exit 1
              ;;
          esac

      # Optional MLflow stage promotion
      - name: Optional MLflow stage transition
        if: ${{ github.ref_name == 'main' && github.event.inputs.approve_prod == 'yes' }}
        run: |
          echo "Optional MLflow stage promotion (manual gate after evaluation)"
          # Uncomment below to enable automatic promotion
          # python scripts/mlflow_stage_transition.py --model_name "${{ github.event.inputs.model_name }}" --stage Production
